name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENV: testing

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/server/requirements.txt
        pip install pytest httpx cryptography pip-audit

    - name: Generate ephemeral encryption key
      # No se usa una clave fija/hardcodeada: se genera una por ejecución.
      run: echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

    - name: Run test suite
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest tests/ -p no:warnings -q

    - name: Audit dependencies for known vulnerabilities
      continue-on-error: true
      run: pip-audit -r src/server/requirements.txt || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Build frontend
      run: |
        cd src/client
        npm ci || npm install
        npm run build
