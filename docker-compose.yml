version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: src/server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: always

  frontend:
    build: src/client
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
